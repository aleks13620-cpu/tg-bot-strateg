name: Daily Reminders

on:
  schedule:
    # Каждые 30 минут — per-user timezone check
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Reminder type: morning, midday, evening, weekly, reactivation, check'
        required: true
        default: 'check'

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        run: |
          TYPE="${{ github.event.inputs.type || 'check' }}"
          curl -sf \
            "https://tg-bot-strateg-1ukh.vercel.app/api/remind?type=${TYPE}&secret=${{ secrets.WEBHOOK_SECRET }}"
