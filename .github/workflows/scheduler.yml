name: Daily Reminders

on:
  schedule:
    # Утреннее напоминание — 8:00 МСК (5:00 UTC)
    - cron: '0 5 * * *'
    # Вечернее напоминание — 18:00 МСК (15:00 UTC)
    - cron: '0 15 * * *'
    # Еженедельный отчёт — суббота 10:00 МСК (7:00 UTC)
    - cron: '0 7 * * 6'
  workflow_dispatch:
    inputs:
      type:
        description: 'Reminder type: morning, evening or weekly'
        required: true
        default: 'morning'

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Determine reminder type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TYPE=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "TYPE=morning" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 7 * * 6" ]; then
            echo "TYPE=weekly" >> $GITHUB_OUTPUT
          else
            echo "TYPE=evening" >> $GITHUB_OUTPUT
          fi

      - name: Send reminder
        run: |
          curl -sf \
            "https://tg-bot-strateg-1ukh.vercel.app/api/remind?type=${{ steps.type.outputs.TYPE }}&secret=${{ secrets.WEBHOOK_SECRET }}"
