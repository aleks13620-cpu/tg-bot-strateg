name: Post-deploy webhook setup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Set Telegram webhook
        run: |
          WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET_TOKEN }}"
          SECRET_PARAM=""
          [ -n "$WEBHOOK_SECRET" ] && SECRET_PARAM="&secret_token=${WEBHOOK_SECRET}"

          # Удаляем webhook чтобы Telegram принял новые параметры (включая secret_token)
          curl -sf "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/deleteWebhook" > /dev/null

          RESULT=$(curl -sf \
            "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook?url=https://tg-bot-strateg-1ukh.vercel.app/api/webhook${SECRET_PARAM}")
          echo "setWebhook response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' || (echo "ERROR: failed to set webhook" && exit 1)

      - name: Verify webhook
        run: |
          INFO=$(curl -sf "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getWebhookInfo")
          echo "Webhook info: $INFO"
          echo "$INFO" | grep -q '"url":"https://tg-bot-strateg-1ukh.vercel.app/api/webhook"' \
            || (echo "ERROR: webhook URL mismatch" && exit 1)
