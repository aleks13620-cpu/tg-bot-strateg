name: Post-deploy webhook setup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Set Telegram webhook
        run: |
          # Ставим временный URL — заставляем Telegram считать webhook "новым"
          curl -sf "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook?url=https://example.com/tmp" > /dev/null
          sleep 2

          # Ставим настоящий URL с secret_token (подставляется GitHub до запуска shell)
          RESULT=$(curl -sf \
            "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook?url=https://tg-bot-strateg-1ukh.vercel.app/api/webhook&secret_token=${{ secrets.WEBHOOK_SECRET_TOKEN }}")
          echo "setWebhook response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' || (echo "ERROR: failed to set webhook" && exit 1)

      - name: Verify webhook
        run: |
          INFO=$(curl -sf "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getWebhookInfo")
          echo "Webhook info: $INFO"
          echo "$INFO" | grep -q '"url":"https://tg-bot-strateg-1ukh.vercel.app/api/webhook"' \
            || (echo "ERROR: webhook URL mismatch" && exit 1)
