name: Post-deploy webhook setup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Set Telegram webhook
        run: |
          # Без curl -f: при ошибке HTTP сохраняем тело ответа в лог (диагностика).
          RESULT=$(curl -sS -X POST \
            -d "url=https://tg-bot-strateg-1ukh.vercel.app/api/webhook" \
            -d "secret_token=${{ secrets.WEBHOOK_SECRET_TOKEN }}" \
            "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/setWebhook")
          echo "setWebhook raw response: $RESULT"
          if echo "$RESULT" | grep -q '"ok":true'; then
            echo "setWebhook: Telegram returned ok:true"
          else
            echo "ERROR: setWebhook returned ok != true (full response logged above)"
            exit 1
          fi

      - name: Verify webhook
        run: |
          INFO=$(curl -sS "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getWebhookInfo")
          echo "getWebhookInfo raw response: $INFO"
          if echo "$INFO" | grep -q '"url":"https://tg-bot-strateg-1ukh.vercel.app/api/webhook"'; then
            echo "Verify: webhook URL matches production"
          else
            echo "ERROR: webhook URL mismatch (full response logged above)"
            exit 1
          fi
